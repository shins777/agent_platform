requires-python = ">=3.12"
dependencies = [
    "google-adk[agent-identity,a2a]>=1.31.0",
    "google-cloud-aiplatform[agent-engines]>=1.70.0",
    "cloudpickle>=3.0.0",
    "google-genai>=1.0.0",
